server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: nextrade-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:nextrade}
    username: ${DB_USER:nextrade}
    password: ${DB_PASS:nextrade}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:}
  threads:
    virtual:
      enabled: true
  cache:
    type: caffeine
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: nextrade-engine
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

nextrade:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
    keys:
      current: ${JWT_KEY_ID_CURRENT:key-1}
      previous: ${JWT_KEY_ID_PREVIOUS:}
  market:
    tick-interval-ms: 1000
  matching:
    partitions: 4
    disruptor-buffer-size: 8192
  risk:
    max-position-pct: 0.20
    max-order-value: 1000000
    max-daily-loss-pct: 0.05
    max-open-orders: 100
    max-leverage: 1.0
    min-order-value: 100.0
    price-collar-pct: 0.10
    fail-closed-on-error: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,heapdump,threaddump
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: nextrade-api
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.nextrade: DEBUG
    org.springframework.web: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
