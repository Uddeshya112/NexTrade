services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nextrade
      POSTGRES_USER: nextrade
      POSTGRES_PASSWORD: nextrade
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U nextrade -d nextrade"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./nextrade-api
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["8080:8080"]
