services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nextrade
      POSTGRES_USER: nextrade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U nextrade -d nextrade"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./nextrade-api
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random bytes}
      JWT_KEY_ID_CURRENT: ${JWT_KEY_ID_CURRENT:-key-1}
      JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET:-}
      JWT_KEY_ID_PREVIOUS: ${JWT_KEY_ID_PREVIOUS:-}
    ports: ["8080:8080"]
